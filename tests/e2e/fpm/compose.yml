# PHP-FPM + nginx + MySQL 8.0 for the nightly "after the reply" job (docs/17 §11, §14.1): the real
# fastcgi_finish_request(), which wp-env (Apache mod_php) and Playground do not have. Started by start.sh; the
# plugin is this repository, mounted read-only. Test site only, on localhost:8080.
name: qersh-fpm

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-proot']
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-fpm
    depends_on:
      db:
        condition: service_healthy
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_HOME', 'http://localhost:8080' );
        define( 'WP_SITEURL', 'http://localhost:8080' );
    volumes: &wp-volumes
      - wp:/var/www/html
      - ../../..:/var/www/html/wp-content/plugins/qersh-for-woocommerce:ro
      - ./mu:/var/www/html/wp-content/mu-plugins:ro

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - wordpress
    ports:
      - '8080:80'
    volumes:
      - wp:/var/www/html:ro
      - ../../..:/var/www/html/wp-content/plugins/qersh-for-woocommerce:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cli:
    image: wordpress:cli-php8.3
    user: '33:33'
    depends_on:
      - wordpress
    environment: *wp-env
    volumes: *wp-volumes
    entrypoint: ['wp']
    profiles: ['cli']

volumes:
  wp: {}
