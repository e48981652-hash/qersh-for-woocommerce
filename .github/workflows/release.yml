# A bare version tag (0.1.0, never v0.1.0) pushed from a clean main (docs/17 §11, §14.3 in the Qersh repository):
# checks that the tag, the plugin header, QERSH_WC_VERSION and readme.txt's Stable tag agree and that the tag is on
# main, builds the zip from the allow-list (--release: the compiled translations must be there) and attaches it, with
# its SHA-256, to the GitHub release of the tag.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the zip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: The tag is a bare version on main, and every version field agrees
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a bare version"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          header=$(sed -n 's/^[ *]*Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' qersh-for-woocommerce.php | head -n 1)
          constant=$(sed -n "s/^define( 'QERSH_WC_VERSION', '\([^']*\)' );/\1/p" qersh-for-woocommerce.php | head -n 1)
          stable=$(sed -n 's/^Stable tag:[[:space:]]*\([^[:space:]]*\).*/\1/p' readme.txt | head -n 1)
          echo "tag $TAG, header $header, QERSH_WC_VERSION $constant, Stable tag $stable"
          [ "$header" = "$TAG" ] && [ "$constant" = "$TAG" ] && [ "$stable" = "$TAG" ] || { echo "::error::the versions do not agree"; exit 1; }

      - name: Build the zip from the allow-list
        run: node scripts/build-zip.mjs --release

      - name: Checksum
        run: |
          cd dist
          sha256sum qersh-for-woocommerce.zip > qersh-for-woocommerce.zip.sha256
          cat qersh-for-woocommerce.zip.sha256

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/qersh-for-woocommerce.zip dist/qersh-for-woocommerce.zip.sha256 --clobber
          else
            # The notes are the CHANGELOG.md section whose heading names the tag.
            notes=$(node -e '
              const fs = require("fs");
              const tag = process.env.TAG;
              const lines = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/) : [];
              const start = lines.findIndex((l) => /^##\s/.test(l) && l.includes(tag));
              const out = [];
              for (let i = start + 1; start >= 0 && i < lines.length && !/^##\s/.test(lines[i]); i++) out.push(lines[i]);
              process.stdout.write(out.join("\n").trim() || `Qersh for WooCommerce ${tag}.`);
            ')
            gh release create "$TAG" dist/qersh-for-woocommerce.zip dist/qersh-for-woocommerce.zip.sha256 --verify-tag --title "$TAG" --notes "$notes"
          fi
